<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" role="img" aria-label="~/projects/siemgen-class">
<style>
  text { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size: 12.5px; fill: #c9d1d9; }
  .h { fill: #f0f6fc; font-weight: 700; font-size: 13.5px; }
  .d { fill: #8b949e; }
  .p, .ok { fill: #39d353; font-weight: 700; }
  .bar { fill: #8b949e; font-size: 11.5px; }
  .tag { fill: #39d353; fill-opacity: .14; stroke: #39d353; stroke-opacity: .5; }
  .tt { fill: #39d353; font-size: 11px; }
  .r { animation: in .45s ease-out both; }
  .cur { fill: #39d353; animation: blink 1s step-end infinite; }
  @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
</style>
<rect x="0.5" y="0.5" width="439" height="219" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M0.5 10.5a10 10 0 0 1 10-10h419a10 10 0 0 1 10 10v20h-439z" fill="#161b22"/>
<line x1="0.5" y1="30.5" x2="439.5" y2="30.5" stroke="#30363d"/>
<circle cx="18" cy="15.5" r="5.5" fill="#ff5f57"/><circle cx="36" cy="15.5" r="5.5" fill="#febc2e"/><circle cx="54" cy="15.5" r="5.5" fill="#28c840"/>
<text x="220.0" y="19.5" class="bar" text-anchor="middle">~/projects/siemgen-class</text>
<rect x="436" y="44" width="2" height="150" rx="1" fill="#39d353" opacity=".6"/>
<text x="20" y="62" class="t r" style="animation-delay:0.2s"><tspan class="p">duarte@ua</tspan><tspan class="d">:~$</tspan> siemgen --seed 1337 --live</text>
<text x="20" y="88" class="h r" style="animation-delay:0.6s">A fake company. Real-looking security logs.</text>
<text x="20" y="110" class="d r" style="animation-delay:0.9s">~20 employees, 7 departments, 14 days of</text>
<text x="20" y="128" class="d r" style="animation-delay:1.2s">history in each product&#x27;s native format,</text>
<text x="20" y="146" class="d r" style="animation-delay:1.6s">then a live feed that never stops writing.</text>
<text x="20" y="176" class="t r" style="animation-delay:2.0s"><tspan class="ok">[  OK  ]</tspan> 13 log sources · same seed, same company <tspan class="cur">█</tspan></text>
<g class="r" style="animation-delay:2.3s"><rect x="20" y="190" width="56" height="18" rx="9" class="tag"/><text x="48.1" y="203" class="tt" text-anchor="middle">python</text></g>
<g class="r" style="animation-delay:2.3s"><rect x="84.2" y="190" width="56" height="18" rx="9" class="tag"/><text x="112.3" y="203" class="tt" text-anchor="middle">docker</text></g>
<g class="r" style="animation-delay:2.3s"><rect x="148.4" y="190" width="76" height="18" rx="9" class="tag"/><text x="186.6" y="203" class="tt" text-anchor="middle">blue-team</text></g>
</svg>
