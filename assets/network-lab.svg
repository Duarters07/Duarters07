<rect x="436" y="44" width="2" height="150" rx="1" fill="#f0883e" opacity=".6"/>
<text x="20" y="62" class="t r" style="animation-delay:0.2s"><tspan class="p">duarte@santos</tspan><tspan class="d">:~$</tspan> show ipv6 route</text>
<text x="20" y="88" class="h r" style="animation-delay:0.6s">A whole company network, emulated.</text>
<text x="20" y="110" class="d r" style="animation-delay:0.9s">Multi-site GNS3 lab: VLSM, dual-stack</text>
<text x="20" y="128" class="d r" style="animation-delay:1.2s">IPv4/IPv6, NAT/PAT, DHCP, BIND9 DNS,</text>
<text x="20" y="146" class="d r" style="animation-delay:1.6s">Apache vhosts and a threaded TCP service.</text>
