<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" role="img" aria-label="~/.dotfiles">
<style>
  text { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size: 12.5px; fill: #c9d1d9; }
  .h { fill: #f0f6fc; font-weight: 700; font-size: 13.5px; }
  .d { fill: #8b949e; }
  .p, .ok { fill: #e3b341; font-weight: 700; }
  .bar { fill: #8b949e; font-size: 11.5px; }
  .tag { fill: #e3b341; fill-opacity: .14; stroke: #e3b341; stroke-opacity: .5; }
  .tt { fill: #e3b341; font-size: 11px; }
  .r { animation: in .45s ease-out both; }
  .cur { fill: #e3b341; animation: blink 1s step-end infinite; }
  @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
</style>
<rect x="0.5" y="0.5" width="439" height="219" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M0.5 10.5a10 10 0 0 1 10-10h419a10 10 0 0 1 10 10v20h-439z" fill="#161b22"/>
<line x1="0.5" y1="30.5" x2="439.5" y2="30.5" stroke="#30363d"/>
<circle cx="18" cy="15.5" r="5.5" fill="#ff5f57"/><circle cx="36" cy="15.5" r="5.5" fill="#febc2e"/><circle cx="54" cy="15.5" r="5.5" fill="#28c840"/>
<text x="220.0" y="19.5" class="bar" text-anchor="middle">~/.dotfiles</text>
<rect x="436" y="44" width="2" height="150" rx="1" fill="#e3b341" opacity=".6"/>
<text x="20" y="62" class="t r" style="animation-delay:0.2s"><tspan class="p">duarte@ua</tspan><tspan class="d">:~$</tspan> nvim ~/.dotfiles</text>
<text x="20" y="88" class="h r" style="animation-delay:0.6s">Where I actually live: the terminal.</text>
<text x="20" y="110" class="d r" style="animation-delay:0.9s">My Arch Linux setup, keyboard-driven:</text>
<text x="20" y="128" class="d r" style="animation-delay:1.2s">Neovim with LSP and Treesitter, Zsh,</text>
<text x="20" y="146" class="d r" style="animation-delay:1.6s">Tmux, Zellij and WezTerm.</text>
<text x="20" y="176" class="t r" style="animation-delay:2.0s"><tspan class="ok">[  OK  ]</tspan> zoxide · atuin · lsd · loaded <tspan class="cur">█</tspan></text>
<g class="r" style="animation-delay:2.3s"><rect x="20" y="190" width="50" height="18" rx="9" class="tag"/><text x="44.8" y="203" class="tt" text-anchor="middle">shell</text></g>
<g class="r" style="animation-delay:2.3s"><rect x="77.5" y="190" width="56" height="18" rx="9" class="tag"/><text x="105.6" y="203" class="tt" text-anchor="middle">neovim</text></g>
<g class="r" style="animation-delay:2.3s"><rect x="141.7" y="190" width="43" height="18" rx="9" class="tag"/><text x="163.1" y="203" class="tt" text-anchor="middle">arch</text></g>
</svg>
